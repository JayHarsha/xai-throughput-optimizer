version: '3.8'

services:
  redis:
    image: redis:7.0-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Mounts your local code so you don't have to rebuild on every code change
    environment:
      # Use the docker service name 'redis' instead of 'localhost'
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      # Cap each Tier-2 worker to half a core so background SHAP/counterfactual
      # churn can never starve the API of CPU on the 2-vCPU benchmark host.
      # Deliberate architectural choice: the interactive tier gets priority.
      resources:
        limits:
          cpus: "0.50"