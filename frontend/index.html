<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAI Loan Underwriting Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
</head>

<body class="bg-gray-50 text-gray-900 font-sans antialiased p-6">
    <div id="root" class="max-w-6xl mx-auto"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Form State
            const [formData, setFormData] = useState({
                loan_amnt: 27000,
                term: 36,
                int_rate: 24.99,
                annual_inc: 35000,
                dti: 42.50,
                fico_range_low: 660,
                revol_util: 95.0
            });

            // API States
            const [tier1Data, setTier1Data] = useState(null);
            const [tier2Data, setTier2Data] = useState(null);
            const [loadingTier1, setLoadingTier1] = useState(false);
            const [loadingTier2, setLoadingTier2] = useState(false);
            const [error, setError] = useState(null);

            // Polling reference
            const pollingInterval = useRef(null);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: parseFloat(value) || value }));
            };

            const submitApplication = async (e) => {
                e.preventDefault();
                setLoadingTier1(true);
                setTier1Data(null);
                setTier2Data(null);
                setError(null);
                setLoadingTier2(false);

                if (pollingInterval.current) clearInterval(pollingInterval.current);

                try {
                    // TIER 1: The Fast Synchronous Call
                    const response = await fetch('http://localhost:8000/predict/hybrid', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    if (!response.ok) throw new Error("API Connection Failed. Is FastAPI running on port 8000?");
                    const data = await response.json();

                    setTier1Data(data);
                    setLoadingTier1(false);

                    // If it requires deep analysis, start TIER 2 Polling
                    const taskId = data.deep_analysis?.task_id;
                    if (taskId) {
                        setLoadingTier2(true);
                        startPolling(taskId);
                    }
                } catch (err) {
                    setError(err.message);
                    setLoadingTier1(false);
                }
            };

            const startPolling = (taskId) => {
                // Poll every 2 seconds
                pollingInterval.current = setInterval(async () => {
                    try {
                        const res = await fetch(`http://localhost:8000/result/${taskId}`);
                        const taskData = await res.json();

                        if (taskData.status === "Completed" || taskData.status === "SUCCESS") {
                            clearInterval(pollingInterval.current);
                            setTier2Data(taskData.data || taskData.result);
                            setLoadingTier2(false);
                        } else if (taskData.status === "FAILED") {
                            clearInterval(pollingInterval.current);
                            setError("Background task failed.");
                            setLoadingTier2(false);
                        }
                        // If Pending/Processing, it just loops again
                    } catch (err) {
                        console.error("Polling error:", err);
                    }
                }, 2000);
            };

            // Cleanup interval on unmount
            useEffect(() => {
                return () => {
                    if (pollingInterval.current) clearInterval(pollingInterval.current);
                };
            }, []);

            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    {/* Left Column: Input Form */}
                    <div className="lg:col-span-4 bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
                        <h2 className="text-xl font-bold mb-1 text-gray-800">New Application</h2>
                        <p className="text-sm text-gray-500 mb-6">Enter applicant risk parameters.</p>

                        <form onSubmit={submitApplication} className="space-y-4">
                            {Object.entries(formData).map(([key, val]) => (
                                <div key={key}>
                                    <label className="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">
                                        {key.replace(/_/g, ' ')}
                                    </label>
                                    <input
                                        type="number"
                                        name={key}
                                        value={val}
                                        onChange={handleInputChange}
                                        step="any"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                                    />
                                </div>
                            ))}
                            <button
                                type="submit"
                                disabled={loadingTier1}
                                className="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors disabled:bg-blue-300"
                            >
                                {loadingTier1 ? "Processing..." : "Submit Application"}
                            </button>
                        </form>
                        {error && <div className="mt-4 p-3 bg-red-100 text-red-700 rounded-md text-sm">{error}</div>}
                    </div>

                    {/* Right Column: Two-Tiered Results */}
                    <div className="lg:col-span-8 space-y-6">

                        {/* TIER 1 RESULT (Fast) */}
                        <div className={`bg-white p-6 rounded-xl shadow-sm border-t-4 transition-opacity duration-500 ${tier1Data ? 'border-blue-500 opacity-100' : 'border-gray-200 opacity-50'}`}>
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h3 className="text-lg font-bold text-gray-800">Tier 1: Synchronous Gateway</h3>
                                    <p className="text-xs text-gray-500">Immediate Base Prediction & Primary XAI</p>
                                </div>
                                {tier1Data && (
                                    <span className="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">
                                        {tier1Data.api_latency_ms} ms
                                    </span>
                                )}
                            </div>

                            {!tier1Data && !loadingTier1 && <p className="text-sm text-gray-400 italic">Awaiting submission...</p>}

                            {loadingTier1 && (
                                <div className="flex items-center space-x-2 text-blue-600">
                                    <svg className="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    <span className="text-sm font-medium">Computing base risk...</span>
                                </div>
                            )}

                            {tier1Data && (
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="p-4 bg-gray-50 rounded-lg">
                                        <p className="text-sm text-gray-500">Risk Tier</p>
                                        <p className="text-2xl font-black text-gray-800">{tier1Data.risk_tier}</p>
                                        <p className="text-xs text-gray-500 mt-1">Probability: {(tier1Data.default_probability * 100).toFixed(1)}%</p>
                                    </div>
                                    <div className="p-4 bg-gray-50 rounded-lg">
                                        <p className="text-sm text-gray-500 mb-2">Top Penalty Factors (SHAP)</p>
                                        <ul className="text-xs space-y-1">
                                            {tier1Data.immediate_primary_factors?.primary_risk_factors.map((f, i) => (
                                                <li key={i} className="flex justify-between border-b border-gray-200 pb-1">
                                                    <span className="truncate pr-2">{f.feature.replace('num__', '')}</span>
                                                    <span className={f.impact > 0 ? 'text-red-600' : 'text-green-600'}>{f.impact.toFixed(3)}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* TIER 2 RESULT (Slow/Polled) */}
                        <div className={`bg-white p-6 rounded-xl shadow-sm border-t-4 transition-opacity duration-500 ${tier2Data ? 'border-purple-500 opacity-100' : (loadingTier2 ? 'border-purple-300 opacity-100' : 'border-gray-200 opacity-50')}`}>
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h3 className="text-lg font-bold text-gray-800">Tier 2: Asynchronous Worker (Celery)</h3>
                                    <p className="text-xs text-gray-500">Heavy Grid Search & Counterfactuals</p>
                                </div>
                                {tier2Data?.background_processing_time_ms && (
                                    <span className="bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1 rounded-full">
                                        {tier2Data.background_processing_time_ms} ms
                                    </span>
                                )}
                            </div>

                            {!tier1Data && !loadingTier2 && !tier2Data && <p className="text-sm text-gray-400 italic">Awaiting Tier 1 trigger...</p>}

                            {tier1Data && tier1Data.risk_tier === "Low" && !loadingTier2 && !tier2Data && (
                                <p className="text-sm text-green-600 font-medium">Applicant is low risk. No counterfactuals required.</p>
                            )}

                            {loadingTier2 && (
                                <div className="flex items-center space-x-3 text-purple-600 bg-purple-50 p-4 rounded-lg">
                                    <svg className="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    <div>
                                        <p className="text-sm font-bold">Grid Search in Progress...</p>
                                        <p className="text-xs opacity-80">Polling Redis via API gateway every 2s. UI is not blocked.</p>
                                    </div>
                                </div>
                            )}

                            {tier2Data && tier2Data.actionable_recourse?.actionable_paths && (
                                <div>
                                    <p className="text-sm font-semibold text-gray-700 mb-3">Actionable Recourse Paths ({tier2Data.actionable_recourse.simulations_run} simulations run)</p>
                                    <div className="space-y-3">
                                        {tier2Data.actionable_recourse.actionable_paths.map((path, i) => (
                                            <div key={i} className="p-3 border border-purple-100 bg-purple-50/30 rounded-lg text-sm">
                                                <div className="grid grid-cols-2 gap-2 mb-2">
                                                    <div><span className="text-gray-500">Loan Amount:</span> <span className="font-bold">${path.suggested_loan_amount}</span></div>
                                                    <div><span className="text-gray-500">Debt Paydown:</span> <span className="font-bold">${path.required_debt_paydown}</span></div>
                                                    <div><span className="text-gray-500">New Risk:</span> <span className="font-bold text-green-600">{(path.new_simulated_risk * 100).toFixed(1)}%</span></div>
                                                </div>
                                                <p className="text-xs text-purple-700 italic border-t border-purple-100 pt-2">{path.compliance_note}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
